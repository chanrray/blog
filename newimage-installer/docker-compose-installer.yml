version: '3'
services:
  http_mysql:
    image: chanrray/docker_study:xampp5.6.19-installer-blog
    restart: unless-stopped
    container_name: blog
    networks:
      caddy:
        ipv4_address: 172.19.0.36
    deploy:
      resources:
        limits:
          cpus: '0.01'
          memory: 90m

networks:
  caddy:
    external: true
