黑苹果</br>
1.	预留MSATA口加装固态</br>
2.	原装4GDDR3内存条加装8GDDR3L内存条共存</br>
3.	6400R机械硬盘更换为7200R</br>
4.	光驱位更换为扩展显卡</br>

6.	可拆卸水冷（后续水桶升级为120冷排，添加了可拆卸头）</br>
7.	原装键盘更换原装美版背光键盘，主板需要加上被阉割的背光模块</br>
