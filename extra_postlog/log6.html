	<h2 align="center">git push后流水线不自动跑，webhook测试报错</h2>
	</br></br>
	问题出现：流水线认证绑定gitlab没问题，git push后流水线不自动跑，webhook测试报错no token。</br></br>
    问题原因：抓包发现自动创建webhook时token传递给pipeline后第三次再传时变为空值。</br></br>
	解决过程：尝试假的token报错变为invalid token说明的确有。</br>
	&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;搜索rancher数据库在generic_object表里找到储存的token。</br>
	&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;重新创建webhook并手动修改抓包添加token。</br></br>
	注意事项：内网需启用本地网络外发请求并重启gitlab。</br>
