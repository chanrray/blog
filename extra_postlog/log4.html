	<h2 align="center">rancher流水线无法绑定gitlab</h2>
	</br></br>
	问题描述：gitlab从version 12升级到13后，rancher pipeline无法绑定gitlab的webhook</br></br>
    问题原因：rancher对oAuth2.0 token有大小写严格判断</br></br>
	解决办法：在发起请求的客户端抓包修改token type为小写</br></br>
	注意事项：0.export http_proxy部分应用无效需修改iptables拦截流量才能进行抓包。</br>
	&nbsp;&nbsp;1.SNAT MASQUERADE </br>&nbsp;&nbsp;2.FORWARD ACCEPT </br>&nbsp;&nbsp;3.DNAT不能与CATTLE_PREROUTING端口重复</br>
	</br>
