	<h2 align="center">postgres数据库镜像无法安装tds-fdw插件</h2>
	</br></br>
	需求来源：pg数据库连接ms sqlserver，当前pg镜像需要添加tds-fdw扩展。</br></br>
    问题原因：pg镜像版本较低，镜像里没有https无法instal https，死循环了。</br></br>
	解决办法：镜像里加代理，手动换古老的http源。</br></br>
